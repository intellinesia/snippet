<!doctype html>
<html><head><style>
body { margin: 0; font-family: sans-serif; background: #0f172a; color: #e2e8f0; }
.shell { display: grid; grid-template-columns: 200px 1fr; min-height: 600px; }
.side { background: #1e293b; padding: 20px; }
.side div { padding: 8px 10px; border-radius: 6px; margin-bottom: 4px; }
.side .on { background: #334155; }
.main { padding: 24px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 120px; gap: 16px; }
.tile { background: #1e293b; border-radius: 10px; padding: 16px; }
.tile b { display: block; font-size: 28px; margin-top: 8px; color: #fff; }
.wide { grid-column: span 2; background: linear-gradient(135deg, #6366f1, #06b6d4); }
.mono { font-family: monospace; font-size: 13px; }
</style></head><body>
<div class="shell" data-cv-id="shell">
  <nav class="side" data-cv-id="side"><div class="on" data-cv-id="nav-home">Overview</div><div>Reports</div><div>Settings</div></nav>
  <main class="main" data-cv-id="main">
    <div class="tile" data-cv-id="t-revenue">Revenue<b>$48.2k</b></div>
    <div class="tile" data-cv-id="t-users">Users<b>1,204</b></div>
    <div class="tile" data-cv-id="t-churn">Churn<b>2.1%</b></div>
    <div class="tile wide" data-cv-id="t-chart">Trend<b>+12%</b></div>
    <div class="tile mono" data-cv-id="t-log">GET /api 200 12ms</div>
  </main>
</div>
</body></html>
