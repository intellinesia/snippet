[package]
name = "canvas-render"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "woff", "floats"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
parley = { version = "0.12", default-features = false, features = ["std"] }
peniko = "0.6"
png = "0.18"
data-url = "0.3.1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3

[workspace]
